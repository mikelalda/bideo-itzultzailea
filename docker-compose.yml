# =============================================================================
# Bideo Itzultzailea - Docker Compose (CPU mode)
# Castellano ↔ Euskera video translation system
# =============================================================================
#
# Usage:
#   docker compose up --build -d
#
# Services:
#   - orchestrator (port 5000): Web UI + translation pipeline
#   - whisper-api  (port 8001): Speech-to-Text (Whisper)
#   - ahotts-api   (port 8002): Text-to-Speech (aHoTTS)
#
# Access the web interface at: http://localhost:5000
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Whisper API - Speech to Text
  # ---------------------------------------------------------------------------
  whisper-api:
    build:
      context: ./services/whisper_API
      dockerfile: Dockerfile
    container_name: whisper-api
    ports:
      - "8001:8000"
    environment:
      - DEVICE=cpu
      - BATCH_SIZE=8
      - MAX_FILE_SIZE_MB=200
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - whisper-models:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

  # ---------------------------------------------------------------------------
  # aHoTTS API - Text to Speech
  # ---------------------------------------------------------------------------
  ahotts-api:
    build:
      context: ./services/aHoTTS_API
      dockerfile: Dockerfile
    container_name: ahotts-api
    ports:
      - "8002:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MAX_TEXT_LENGTH=5000
    volumes:
      - ahotts-voices:/app/aHoTTS/ahotts/voices
      - ahotts-hf-cache:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Orchestrator - Web UI + Translation Pipeline
  # ---------------------------------------------------------------------------
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bideo-itzultzailea
    ports:
      - "5000:5000"
    environment:
      - WHISPER_API_URL=http://whisper-api:8000
      - AHOTTS_API_URL=http://ahotts-api:8000
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
      - translation-models:/root/.cache/huggingface
    depends_on:
      - whisper-api
      - ahotts-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

volumes:
  whisper-models:
    name: whisper-models
  ahotts-voices:
    name: ahotts-voices
  ahotts-hf-cache:
    name: ahotts-hf-cache
  uploads:
    name: bideo-uploads
  outputs:
    name: bideo-outputs
  translation-models:
    name: translation-models
