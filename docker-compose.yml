# =============================================================================
# Bideo Itzultzailea - tokiko ingurunea (CPU)
#
#   docker compose up --build -d
#   -> http://localhost:7860
#
# HF Space-ak Dockerfile bera erabiltzen du; hau tokian probatzeko da.
# =============================================================================

services:
  bideo-itzultzailea:
    build:
      context: .
      dockerfile: Dockerfile
    image: bideo-itzultzailea:cpu
    container_name: bideo-itzultzailea
    ports:
      - "7860:7860"
    environment:
      # HF Space-ko cpu-basic hardwarea simulatzeko: NUM_THREADS=2
      - NUM_THREADS=${NUM_THREADS:-4}
    volumes:
      - bideo-data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12G

volumes:
  bideo-data:
    name: bideo-data
